<!doctype html>
<html lang="ko" data-minihub-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미니게임</title>
<script src="shared/minihub-theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Dongle:wght@400;700&display=swap">
<link rel="stylesheet" href="hub/ranking.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" id="brand">미니게임</a>
  <button id="theme-btn" class="chip theme" type="button"></button>
  <button id="name-chip" class="chip" type="button" title="내 정보 · 닉네임 바꾸기 · 다른 닉네임으로 접속">…</button>
</header>
<div id="banners"></div>
<div class="layout">
  <aside class="switcher">
    <h6 class="side-h">순위표</h6>
    <div class="tiles" id="tiles"></div>
  </aside>
  <main class="main">
    <div class="head">
      <h1 id="title">랭킹</h1>
      <p class="desc" id="desc"></p>
      <span class="basis" id="basis"></span>
      <span id="head-play"></span>
    </div>
    <div id="board"><p class="empty">불러오는 중…</p></div>
  </main>
</div>
<div class="mybar" id="mybar" hidden></div>
<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <span class="grab"></span>
    <div class="sheet-h">
      <div><h2 id="sheet-title">어떤 게임을 할까요?</h2><p>안 해본 게임은 한 판만 해도 종합 포인트가 올라가요.</p></div>
      <button class="x" type="button" id="sheet-x" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="picks" id="picks"></div>
  </div>
</div>
<script src="shared/minihub-sdk.js"></script>
<script src="hub/ranking.js"></script>
<script>
  // 밝게/어둡게 버튼 (선택은 모든 게임과 공유)
  (function () {
    var btn = document.getElementById("theme-btn");
    var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>';
    var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    function paint() {
      var dark = MiniHubTheme.get() === "dark";
      btn.innerHTML = dark ? SUN : MOON;
      btn.title = btn.ariaLabel = dark ? "밝은 모드로 바꾸기" : "어두운 모드로 바꾸기";
    }
    btn.addEventListener("click", function () { MiniHubTheme.toggle(); });
    MiniHubTheme.onChange(paint);
    paint();
  })();
</script>
</body>
</html>
