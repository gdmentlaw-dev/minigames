<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="hub/style.css">
</head>
<body>
<header id="topbar">
  <span class="logo" id="logo">🎮 미니게임</span>
  <button id="name-chip" class="chip" type="button" title="내 정보 · 닉네임 바꾸기 · 다른 닉네임으로 접속">…</button>
</header>
<div id="banners"></div>
<main>
  <section class="card hero">
    <div>
      <p class="muted" id="hello">불러오는 중…</p>
      <h1>내 기록</h1>
    </div>
    <div class="stats">
      <div class="stat"><b id="my-rank">-</b><span>종합 순위</span></div>
      <div class="stat"><b id="my-total">-</b><span>종합 포인트</span></div>
      <div class="stat"><b id="my-played">-</b><span>참여 게임</span></div>
    </div>
  </section>

  <div class="section-title"><h2>게임</h2></div>
  <div class="grid" id="games"></div>

  <div class="section-title"><h2>랭킹</h2><button class="btn ghost small" id="refresh">↻ 새로고침</button></div>
  <div class="tabs" id="tabs"></div>
  <p class="muted desc" id="board-desc"></p>
  <div id="board"><p class="card empty">불러오는 중…</p></div>
  <div id="mine" class="mine"></div>
</main>

<script src="shared/minihub-sdk.js"></script>
<script src="hub/app.js"></script>
</body>
</html>
