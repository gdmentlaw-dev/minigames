<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랭킹</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="hub/style.css">
</head>
<body>
<header id="topbar"></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div class="rank-head">
    <div>
      <h2 id="board-title">랭킹</h2>
      <p class="muted" id="board-desc"></p>
    </div>
    <button class="btn ghost" id="refresh">↻ 새로고침</button>
  </div>
  <div id="board"><p class="card empty">불러오는 중…</p></div>
  <div id="mine" class="mine"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="hub/config.js"></script>
<script src="hub/store.js"></script>
<script src="hub/common.js"></script>
<script>
(async () => {
  const { store, esc, fmtScore, fmtPoints } = Hub;
  document.title = `랭킹 · ${MINIHUB_CONFIG.siteTitle || "미니게임"}`;
  await Hub.boot("ranking");

  const games = await Hub.loadGames();
  const ids = games.map((g) => g.id);
  const byId = Object.fromEntries(games.map((g) => [g.id, g]));
  const LIMIT = 100;

  let current = location.hash.slice(1);
  if (current !== "overall" && !byId[current]) current = "overall";

  const tabs = document.getElementById("tabs");
  tabs.innerHTML = [`<button data-id="overall">🏆 종합</button>`]
    .concat(games.map((g) => `<button data-id="${esc(g.id)}">${esc(g.title)}</button>`)).join("");
  tabs.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    current = b.dataset.id;
    history.replaceState(null, "", "#" + current);
    render();
  });

  const medal = (r) => ["🥇", "🥈", "🥉"][r - 1] ? `<span class="medal">${["🥇", "🥈", "🥉"][r - 1]}</span>` : r;
  const isMe = (r) => r.player_id === store.uid();

  function overallTable(rows) {
    return `<table class="rank">
      <thead><tr><th>순위</th><th>닉네임</th><th class="num hide-sm">참여</th><th class="num">포인트</th></tr></thead>
      <tbody>${rows.map((r) => {
        const detail = Object.entries(r.per_game || {})
          .filter(([gid]) => byId[gid])
          .map(([gid, p]) => `${esc(byId[gid].title)} ${fmtPoints(p)}`).join(" · ");
        return `<tr class="${isMe(r) ? "me" : ""}">
          <td class="pos">${medal(r.rank)}</td>
          <td class="name">${esc(r.name)}<span class="sub">${detail}</span></td>
          <td class="num hide-sm">${r.games_played}/${games.length}</td>
          <td class="num"><b>${fmtPoints(r.total)}</b></td></tr>`;
      }).join("")}</tbody></table>`;
  }

  function gameTable(rows, g) {
    return `<table class="rank">
      <thead><tr><th>순위</th><th>닉네임</th><th class="num">기록</th><th class="num hide-sm">포인트</th></tr></thead>
      <tbody>${rows.map((r) => `<tr class="${isMe(r) ? "me" : ""}">
          <td class="pos">${medal(r.rank)}</td>
          <td class="name">${esc(r.name)}</td>
          <td class="num"><b>${esc(fmtScore(r.score, g.scoreUnit))}</b></td>
          <td class="num hide-sm">${fmtPoints(r.points)}</td></tr>`).join("")}</tbody></table>`;
  }

  let busy = false;
  async function render() {
    if (busy) return;
    busy = true;
    tabs.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.id === current));
    const board = document.getElementById("board");
    const mine = document.getElementById("mine");
    try {
      if (current === "overall") {
        document.getElementById("board-title").textContent = "🏆 종합 랭킹";
        document.getElementById("board-desc").textContent =
          `게임마다 순위를 0~100 포인트로 바꿔 합산 (1등 100, 안 한 게임 0) · 최대 ${games.length * 100}`;
        const [rows, me] = await Promise.all([store.getOverall(ids, LIMIT), store.getMyOverall(ids)]);
        board.innerHTML = rows.length ? overallTable(rows) : `<p class="card empty">아직 기록이 없어요</p>`;
        mine.innerHTML = me && !rows.some(isMe)
          ? `<p class="muted">내 순위</p>${overallTable([me])}` : "";
      } else {
        const g = byId[current];
        document.getElementById("board-title").textContent = g.title;
        document.getElementById("board-desc").textContent =
          `${g.scoreOrder === "asc" ? "낮을수록" : "높을수록"} 좋은 기록 · 플레이어별 최고 기록 · 만든 사람 ${g.author}`;
        const [rows, me] = await Promise.all([store.getGameRanking(g.id, LIMIT), store.getMyGameEntry(g.id)]);
        board.innerHTML = rows.length
          ? gameTable(rows, g)
          : `<p class="card empty">아직 기록이 없어요. <a href="play.html?game=${encodeURIComponent(g.id)}">첫 도전하기 →</a></p>`;
        mine.innerHTML = me && !rows.some(isMe) ? `<p class="muted">내 순위</p>${gameTable([me], g)}` : "";
      }
    } catch (e) {
      console.error(e);
      board.innerHTML = `<p class="card empty">랭킹을 불러오지 못했어요. 새로고침해주세요.</p>`;
    } finally {
      busy = false;
    }
  }

  window.addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    current = h === "overall" || byId[h] ? h : "overall";
    render();
  });
  document.getElementById("refresh").addEventListener("click", render);
  document.addEventListener("hub:namechange", render);
  // 화면을 보고 있을 때만 30초마다 자동 새로고침
  setInterval(() => { if (!document.hidden) render(); }, 30000);
  render();
})();
</script>
</body>
</html>
