<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1c1d4d"/>
      <stop offset=".55" stop-color="#121838"/>
      <stop offset="1" stop-color="#0e2446"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9cc2"/>
      <stop offset="1" stop-color="#b69cff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 라벤더 손패 받침 -->
  <rect x="36" y="300" width="440" height="78" rx="39" fill="#272f69"/>
  <rect x="36" y="300" width="440" height="78" rx="39" fill="none" stroke="#333c7a" stroke-width="4"/>
  <!-- 젤리 타일 3장 (그룹 7·7·7) -->
  <g font-family="sans-serif" font-weight="800" font-size="104" text-anchor="middle">
    <g transform="rotate(-7 122 230)">
      <rect x="62" y="150" width="120" height="164" rx="30" fill="#c4bce6"/>
      <rect x="62" y="140" width="120" height="160" rx="30" fill="#f6f4ff"/>
      <text x="122" y="258" fill="#ef4f6f">7</text>
    </g>
    <g>
      <rect x="194" y="104" width="124" height="168" rx="31" fill="#f6f4ff"/>
      <rect x="194" y="104" width="124" height="168" rx="31" fill="none" stroke="#b69cff" stroke-width="9"/>
      <rect x="200" y="252" width="112" height="12" rx="6" fill="#c4bce6"/>
      <text x="256" y="224" fill="#3d8be0">7</text>
    </g>
    <g transform="rotate(7 390 230)">
      <rect x="330" y="150" width="120" height="164" rx="30" fill="#c4bce6"/>
      <rect x="330" y="140" width="120" height="160" rx="30" fill="#f6f4ff"/>
      <text x="390" y="258" fill="#4a3d6e">7</text>
    </g>
  </g>
  <!-- COMBO 알약 -->
  <rect x="136" y="404" width="240" height="70" rx="35" fill="#9a80e0"/>
  <rect x="136" y="398" width="240" height="70" rx="35" fill="url(#pill)"/>
  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="800" fill="#fff" letter-spacing="2">COMBO</text>
  <!-- 반짝이 -->
  <g fill="#ff9cc2">
    <path d="M440 70l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
  </g>
  <g fill="#b69cff">
    <path d="M70 70l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
  </g>
