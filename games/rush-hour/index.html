<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>러시아워</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 점수 = 판별 점수의 합 (높을수록 좋음, scoreOrder "desc"). 판 점수는 난이도(별 1~3) x 이동 효율 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #16132e; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: Pretendard, system-ui, sans-serif; color: #f4f2ff;
         user-select: none; -webkit-user-select: none; touch-action: none; }
  #stage { width: 360px; height: 640px; flex: none; position: relative; transform-origin: center center; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column;
            align-items: center; padding: 24px 18px; text-align: center; gap: 14px; }
  .screen.on { display: flex; }
  #s-start { justify-content: center; gap: 18px; }
  h1 { font-size: 40px; font-weight: 800; }
  h2 { font-size: 24px; font-weight: 800; }
  /* 시작 화면 로고: 기울인 굵은 글씨 + 달리는 느낌의 그림자 */
  .logo { font-style: italic; font-weight: 900; font-size: 38px; letter-spacing: -1px; text-transform: uppercase;
          transform: skewX(-8deg); white-space: nowrap; color: #ffc83d;
          text-shadow: 3px 3px 0 #e0453a, 6px 6px 0 rgba(124,108,240,.6); }
  .logo .car-l, .logo .car-r { display: inline-block; font-size: 32px; text-shadow: none; }
  .logo .car-l { transform: scaleX(-1); }   /* 왼쪽 차는 오른쪽을 보게 */
  .logo .car-r { animation: dash 1.2s ease-in-out infinite alternate; }
  .title2 { font-style: italic; font-weight: 900; font-size: 30px; transform: skewX(-8deg); color: #ffc83d;
            text-transform: uppercase; text-shadow: 2px 2px 0 #e0453a, 4px 4px 0 rgba(124,108,240,.6); }
  @keyframes dash { from { transform: translateX(-3px); } to { transform: translateX(4px); } }
  .hello { color: #ffc83d; font-size: 18px; font-weight: 700; min-height: 1.4em; }
  .desc { color: #b9b3e6; font-size: 15px; line-height: 1.6; }
  .btn { border: 0; border-radius: 14px; padding: 13px 24px; font: inherit; font-size: 18px;
         font-weight: 800; cursor: pointer; background: #ffc83d; color: #16132e; min-width: 150px; }
  .btn.sub { background: #231f45; color: #f4f2ff; }
  .btn.small { font-size: 15px; padding: 9px 14px; min-width: 0; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center; }

  /* 판 고르기 */
  /* 최소 이동 횟수는 초록 배지로 다른 기록과 구분 */
  .minb { display: inline-block; background: rgba(95,224,143,.18); color: #5fe08f; font-weight: 800;
          border-radius: 6px; padding: 0 7px; }
  .legend { font-size: 12px; color: #b9b3e6; margin-top: -6px; }
  #summary { color: #b9b3e6; font-size: 14px; line-height: 1.5; }
  #summary b { color: #ffc83d; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%;
          overflow-y: auto; max-height: 440px; padding: 2px; touch-action: pan-y; }
  .lv { background: #231f45; border: 2px solid transparent; border-radius: 12px; padding: 8px 2px;
        cursor: pointer; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .lv .n { font-size: 18px; font-weight: 800; }
  .lv svg { width: 66px; height: 66px; display: block; }
  .lv .m { font-size: 10px; color: #b9b3e6; }
  .lv .df { font-size: 12px; color: #ffc83d; letter-spacing: 1px; }
  .lv .st { font-size: 12px; min-height: 1.2em; font-weight: 700; }
  .lv.done { border-color: #7c6cf0; }                 /* 깼지만 최소 이동이 아님 → 다시 도전 가능 */
  .lv.done .st { color: #ffc83d; }
  .lv.perfect { border-color: #27ae60; }
  .lv.perfect .st { color: #5fe08f; }

  /* 플레이 */
  #top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  #info { font-size: 15px; color: #b9b3e6; line-height: 1.5; }
  #info b { color: #ffc83d; font-size: 18px; }
  #board { width: 324px; height: 324px; background: #231f45; border-radius: 12px; position: relative;
           flex: none; box-shadow: 0 0 0 5px #3a3470; touch-action: none; }
  #exit { position: absolute; right: -9px; top: 108px; width: 9px; height: 54px; background: #16132e; }
  #exit::after { content: "▶"; position: absolute; right: -18px; top: 15px; color: #ffc83d; font-size: 16px; }
  .cell { position: absolute; width: 54px; height: 54px; }
  .car { position: absolute; border-radius: 9px; cursor: grab; transition: left .12s, top .12s; }
  .car.drag { transition: none; cursor: grabbing; z-index: 5; }
  /* 일반 차: 차분한 색 + 어두운 창문 자국 */
  .car { box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
  .car::after { content: ""; position: absolute; inset: 7px; border-radius: 6px; background: rgba(0,0,0,.2); }
  /* 빨간 차: 밝은 빨강 + 노란 테두리 + 빛 + 자동차 아이콘 */
  .car.red { background: linear-gradient(#ff6a5c, #d1281c); z-index: 3;
             box-shadow: 0 0 0 3px #ffc83d, 0 0 16px 4px rgba(255,90,77,.75); }
  .car.red::after { background: rgba(255,255,255,.22); }
  #msg { min-height: 1.5em; font-size: 14px; color: #ffc83d; font-weight: 700; }
  #timer { font-size: 16px; color: #b9b3e6; font-weight: 700; min-width: 72px; text-align: left; font-variant-numeric: tabular-nums; }
  #btn-hint.empty { opacity: .45; }
  /* 힌트 표시: 움직일 차(노란 깜빡임) / 도착 자리(점선) */
  .car.hl-move { outline: 3px solid #ffc83d; outline-offset: 2px; z-index: 4; animation: blink .7s ease-in-out infinite alternate; }
  .ghost { position: absolute; border: 3px dashed #ffc83d; border-radius: 9px; background: rgba(255,200,61,.15);
           z-index: 6; pointer-events: none; animation: blink .7s ease-in-out infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: .35; } }
  #clear { position: absolute; inset: 0; background: rgba(22,19,46,.92); display: none; flex-direction: column;
           align-items: center; justify-content: center; gap: 14px; z-index: 10; padding: 24px; }
  #clear.on { display: flex; }
  #c-big { font-size: 34px; font-weight: 800; color: #ffc83d; }
</style>
</head>
<body>
<div id="stage">
  <!-- 시작 -->
  <section class="screen on" id="s-start">
    <h1 class="logo"><span class="car-l">🚗</span> rush hour <span class="car-r">🚗</span></h1>
    <p class="hello" id="hello">&nbsp;</p>
    <p class="desc">차를 밀어서 <b style="color:#ff5a4d">빨간 차</b>를 오른쪽 출구로 빼내세요.<br>이동 횟수가 적을수록 좋은 기록이에요!<br>많이 헤매면 💡힌트가 열려요.<br>조작: 차를 끌기 (마우스/터치)</p>
    <button class="btn" id="btn-start">시작</button>
    <button class="btn sub" id="btn-exit1">메인으로</button>
  </section>

  <!-- stages -->
  <section class="screen" id="s-select">
    <h2 class="title2">stages</h2>
    <p class="legend">★☆☆ 최대 100점 · ★★☆ 최대 200점 · ★★★ 최대 300점</p>
    <p id="summary"></p>
    <div id="grid"></div>
    <div class="row">
      <button class="btn sub small" id="btn-exit2">메인으로</button>
    </div>
  </section>

  <!-- 플레이 -->
  <section class="screen" id="s-play">
    <div id="top">
      <button class="btn sub small" id="btn-list">☰ stages</button>
      <div id="info"></div>
    </div>
    <div id="board"><div id="exit"></div></div>
    <p id="msg">&nbsp;</p>
    <div class="row">
      <button class="btn small" id="btn-hint">💡 힌트 0</button>
      <span id="timer">⏱ 0:00</span>
    </div>
    <div class="row">
      <button class="btn sub small" id="btn-undo">↩ 되돌리기</button>
      <button class="btn sub small" id="btn-reset">⟲ 처음부터</button>
    </div>
    <div id="clear">
      <div id="c-big">클리어!</div>
      <p class="desc" id="c-text"></p>
      <button class="btn" id="c-next">다음 판 →</button>
      <button class="btn sub" id="c-retry">⟲ 다시 도전</button>
      <button class="btn sub" id="c-list">☰ stages</button>
    </div>
  </section>
</div>

<script src="../../shared/minihub-sdk.js"></script>
<script>
(() => {
  const GAME_ID = "rush-hour";
  const N = 6, CELL = 54;
  const COLORS = ["#5d6b8f", "#4c7c84", "#76688f", "#8a7d5c", "#5f7f66", "#7d6670", "#68758a", "#867b72"];
  const $ = (id) => document.getElementById(id);

  let levels = [];
  let best = {};          // { "1": 최소로 깬 이동 횟수, ... }  ← 서버에 저장
  let cur = null;         // 현재 판 상태
  let lastSubmitted = null;

  // ---------- 화면 크기 맞추기 ----------
  const stage = $("stage");
  function fit() {
    const s = Math.min(innerWidth / 360, innerHeight / 640);
    stage.style.transform = `scale(${s})`;
  }
  addEventListener("resize", fit); fit();

  function show(id) {
    document.querySelectorAll(".screen").forEach((e) => e.classList.toggle("on", e.id === id));
  }

  // ---------- 저장 / 점수 ----------
  async function saveProgress() { try { await MiniHub.save({ v: 2, best }); } catch {} }
  const clearedCount = () => levels.filter((l) => best[l.id] != null).length;
  const allCleared = () => levels.length > 0 && clearedCount() === levels.length;
  // 난이도 별: 최소 이동 7 이하 ★, 8~13 ★★, 14 이상 ★★★ (판 점수 최대 = 별 x 100)
  const diff = (l) => (l.min <= 7 ? 1 : l.min <= 13 ? 2 : 3);
  const stars = (n) => "★".repeat(n) + "☆".repeat(3 - n);
  // 판 점수(최대 별x100): 최소 이동이면 만점. 더 쓴 수가 최소 이동(작은 판은 5)의 2배가 될 때까지 곧게 줄어 만점의 20%에서 멈춘다.
  const stagePts = (l, moves) => {
    const r = Math.max(0, moves - l.min) / Math.max(l.min, 5);
    return Math.round(diff(l) * 100 * Math.max(0.2, 1 - 0.4 * r));
  };
  const ptsOf = (l) => (best[l.id] != null ? stagePts(l, best[l.id]) : 0);
  const score = () => levels.reduce((s, l) => s + ptsOf(l), 0);
  const maxScore = () => levels.reduce((s, l) => s + diff(l) * 100, 0);

  // 내 순위: 서버의 랭킹표에서 내 등수를 찾아 stages 화면에 보여준다 (stages 화면을 열 때 1번 조회)
  let me = null, myRank = null;
  const rankText = () => (myRank ? ` (${myRank}등)` : "");
  async function refreshRank() {
    if (!me || clearedCount() === 0) return;
    try {
      const list = await MiniHub.getGameRanking(GAME_ID, 1000);
      const e = list.find((x) => x.player_id === me.id);
      myRank = e ? e.rank : null;
      document.querySelectorAll("#summary .rk").forEach((el) => (el.textContent = rankText()));
    } catch {}
  }

  async function submitScoreNow() {
    if (clearedCount() === 0) return null;
    const t = score();
    if (t === lastSubmitted) return null;
    lastSubmitted = t;
    const r = await MiniHub.submitScore(t);
    if (r && r.rank) myRank = r.rank;
    return r;
  }

  // ---------- 판 고르기 ----------
  // 시작 상태를 작은 그림(SVG)으로 그린다. 서버 요청 없이 levels.json 정보만 사용
  function thumb(l) {
    const u = 10, pad = 2, size = N * u + pad * 2;
    let r = "";
    l.cars.forEach((c, i) => {
      const h = c[3] === "h", w = (h ? c[2] : 1) * u - 1, ht = (h ? 1 : c[2]) * u - 1;
      const fill = i === 0 ? "#ff5a4d" : COLORS[i % COLORS.length];
      r += `<rect x="${pad + c[0] * u + .5}" y="${pad + c[1] * u + .5}" width="${w}" height="${ht}" rx="2" fill="${fill}"${i === 0 ? ' stroke="#ffc83d" stroke-width=".8"' : ""}/>`;
    });
    return `<svg viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" rx="3" fill="#16132e"/>${r}</svg>`;
  }
  function renderSelect() {
    const done = clearedCount();
    $("summary").innerHTML = allCleared()
      ? `전부 클리어! 내 점수 <b>${score()}</b> / ${maxScore()}<span class="rk">${rankText()}</span><br>✓ 최소 이동으로 깬 판 ${levels.filter((l) => best[l.id] === l.min).length}/${levels.length}`
      : `클리어 <b>${done}/${levels.length}</b> · 내 점수 <b>${score()}</b> / ${maxScore()}<span class="rk">${rankText()}</span>`;
    const g = $("grid"); g.innerHTML = "";
    for (const l of levels) {
      const b = best[l.id];
      const b2 = document.createElement("button");
      b2.className = "lv" + (b != null ? (b === l.min ? " perfect" : " done") : "");
      b2.innerHTML = `<span class="n">${l.no}</span>${thumb(l)}<span class="df">${stars(diff(l))}</span><span class="m">${diff(l) * 100}점 · 최소 ${l.min}</span>` +
        `<span class="st">${b == null ? "" : (b === l.min ? "✓ " : "↻ ") + ptsOf(l) + "점"}</span>`;
      b2.onclick = () => startLevel(l.id);
      g.appendChild(b2);
    }
    show("s-select");
    refreshRank();
  }

  // ---------- 플레이 ----------
  const board = $("board");
  // keep: "처음부터"일 때 이전 판의 힌트 진행(가장 많이 움직인 횟수, 걸린 시간, 쓴 힌트)을 이어받는다
  function startLevel(id, keep) {
    const l = levels.find((x) => x.id === id);
    cur = { level: l, cars: l.cars.map((c) => ({ x: c[0], y: c[1], len: c[2], h: c[3] === "h" })),
            moves: 0, hist: [], done: false,
            peak: keep ? keep.peak : 0, elapsed: keep ? keep.elapsed : 0, used: keep ? keep.used : 0,
            hintStage: 0, hintText: "", lastEarned: 0, flashUntil: 0 };
    cur.lastEarned = earnedHints();
    $("clear").classList.remove("on");
    buildBoard(); updateInfo(); show("s-play");
  }

  // ---------- 힌트 ----------
  const HINT_MAX = 6;         // 판당 얻을 수 있는 힌트 최대 개수
  const HINT_TIME = 120;    // 이 시간(초)마다 힌트 1개 (시간 보너스)
  const hintStep = (l) => Math.ceil(Math.max(l.min, 5) / 3);  // 최소 이동 대비 이만큼 더 움직일 때마다 힌트 1개
  const movesEarned = () => Math.max(0, Math.floor((cur.peak - cur.level.min) / hintStep(cur.level)));
  const timeEarned = () => Math.floor(cur.elapsed / HINT_TIME);
  const earnedHints = () => Math.min(HINT_MAX, movesEarned() + timeEarned());
  const fmtTime = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  // 지금 상태에서 빨간 차를 빼내는 가장 짧은 길(BFS)의 첫 수. 차 하나를 원하는 만큼 미는 것이 1수.
  function solveNext() {
    const cars = cur.cars, n = cars.length;
    const enc = (p) => p.reduce((k, v) => k * N + v, 0);
    const start = cars.map((c) => (c.h ? c.x : c.y));
    if (start[0] === N - 2) return null;
    const seen = new Map([[enc(start), null]]);       // 상태 → { prev, i, from, to }
    let queue = [start];
    while (queue.length) {
      const next = [];
      for (const p of queue) {
        const occ = new Array(N * N).fill(-1);
        cars.forEach((c, i) => { for (let k = 0; k < c.len; k++) occ[c.h ? c.y * N + p[i] + k : (p[i] + k) * N + c.x] = i; });
        const pk = enc(p);
        for (let i = 0; i < n; i++) {
          const c = cars[i];
          const free = (q) => occ[c.h ? c.y * N + q : q * N + c.x] === -1;
          for (const d of [-1, 1]) {
            for (let q = p[i] + d; q >= 0 && q + c.len <= N; q += d) {
              if (!free(d < 0 ? q : q + c.len - 1)) break;
              const np = p.slice(); np[i] = q;
              const k = enc(np);
              if (seen.has(k)) continue;
              seen.set(k, { prev: pk, i, from: p[i], to: q });
              if (np[0] === N - 2) {                  // 도착: 거꾸로 따라가 첫 수를 찾는다
                let node = seen.get(k), first = node;
                while (node) { first = node; node = seen.get(node.prev); }
                return first;
              }
              next.push(np);
            }
          }
        }
      }
      queue = next;
    }
    return null;
  }

  function clearHint() {
    if (!cur) return;
    cur.hintStage = 0; cur.hintText = "";
    board.querySelectorAll(".ghost").forEach((e) => e.remove());
    cur.cars.forEach((c) => c.el && c.el.classList.remove("hl-move"));
  }

  function useHint() {
    if (!cur || cur.done) return;
    if (earnedHints() - cur.used <= 0) { cur.flashUntil = 0; refreshHud(true); return; }
    if (cur.hintStage >= 3) return;                   // 이미 마지막 단계를 보여주는 중이면 힌트를 더 쓰지 않는다
    const mv = solveNext();
    if (!mv) { cur.hintText = "힌트를 찾지 못했어요"; refreshHud(); return; }
    cur.used++;
    const st = Math.min(3, cur.hintStage + 1);
    clearHint();
    cur.hintStage = st;
    // 1단계: 움직일 차 / 2단계: 방향과 칸 수 / 3단계: 도착 자리(점선)
    const c = cur.cars[mv.i], n = Math.abs(mv.to - mv.from);
    const dir = c.h ? (mv.to < mv.from ? "왼쪽으로" : "오른쪽으로") : (mv.to < mv.from ? "위로" : "아래로");
    c.el.classList.add("hl-move");
    if (st === 1) cur.hintText = mv.i === 0 ? "💡 먼저 빨간 차를 움직여야 해요" : "💡 깜빡이는 차를 먼저 움직여 보세요";
    else if (st === 2) cur.hintText = `💡 ${mv.i === 0 ? "빨간 차를" : "깜빡이는 차를"} ${dir} ${n}칸`;
    else {
      const g = document.createElement("div");
      g.className = "ghost";
      g.style.width = (c.h ? c.len * CELL : CELL) - 4 + "px";
      g.style.height = (c.h ? CELL : c.len * CELL) - 4 + "px";
      g.style.left = (c.h ? mv.to : c.x) * CELL + 2 + "px";
      g.style.top = (c.h ? c.y : mv.to) * CELL + 2 + "px";
      board.appendChild(g);
      cur.hintText = "💡 점선 자리로 옮겨 보세요";
    }
    refreshHud();
  }

  // 타이머·힌트 개수·안내 문구 갱신
  function refreshHud(noHintMsg) {
    if (!cur) return;
    const earned = earnedHints(), avail = earned - cur.used;
    $("timer").textContent = "⏱ " + fmtTime(cur.elapsed);
    $("btn-hint").textContent = "💡 힌트 " + Math.max(0, avail);
    $("btn-hint").classList.toggle("empty", avail <= 0);
    if (cur.done) { $("msg").innerHTML = "&nbsp;"; return; }
    if (earned > cur.lastEarned) cur.flashUntil = Date.now() + 3500;
    cur.lastEarned = earned;
    let t = "";
    if (cur.hintText) t = cur.hintText;
    else if (Date.now() < cur.flashUntil) t = "💡 힌트가 생겼어요!";
    else if (earned < HINT_MAX) {                     // 다음 힌트까지 남은 조건 (이동 또는 시간 중 먼저 채워지는 쪽)
      const mv = cur.level.min + (movesEarned() + 1) * hintStep(cur.level) - cur.peak;
      t = `💡 다음 힌트까지 이동 ${mv}번 또는 ${fmtTime((timeEarned() + 1) * HINT_TIME - cur.elapsed)}`;
    } else if (avail <= 0 && noHintMsg) t = "💡 이 판의 힌트를 모두 썼어요";
    else if (earned >= HINT_MAX) t = "💡 이 판의 힌트를 모두 얻었어요";
    $("msg").textContent = t || " ";
  }

  // 타이머: 플레이 화면이 보일 때만 흐른다 (stages 화면·탭 숨김·클리어 후에는 멈춤)
  let lastTick = Date.now();
  setInterval(() => {
    const now = Date.now(), dt = Math.min(1, (now - lastTick) / 1000);
    lastTick = now;
    if (!cur || cur.done || document.hidden || !$("s-play").classList.contains("on")) return;
    cur.elapsed += dt;
    refreshHud();
  }, 250);

  function buildBoard() {
    board.querySelectorAll(".car, .ghost").forEach((e) => e.remove());
    cur.cars.forEach((c, i) => {
      const d = document.createElement("div");
      d.className = "car" + (i === 0 ? " red" : "");
      if (i) d.style.background = COLORS[i % COLORS.length];
      d.style.width = (c.h ? c.len * CELL : CELL) - 4 + "px";
      d.style.height = (c.h ? CELL : c.len * CELL) - 4 + "px";
      c.el = d; place(c);
      d.addEventListener("pointerdown", (e) => dragStart(e, i));
      board.appendChild(d);
    });
  }
  function place(c) { c.el.style.left = c.x * CELL + 2 + "px"; c.el.style.top = c.y * CELL + 2 + "px"; }

  function updateInfo() {
    const b = best[cur.level.id];
    $("info").innerHTML = `${cur.level.no}판 <span style="color:#ffc83d">${stars(diff(cur.level))}</span> · 이동 <b>${cur.moves}</b><br><span class="minb">최소 ${cur.level.min}번</span>${b != null ? "<br>내 최고 기록: " + b + "번(" + stagePts(cur.level, b) + "/" + diff(cur.level) * 100 + ")" : ""}`;
    refreshHud();
  }

  function grid(except) {
    const g = Array.from({ length: N }, () => Array(N).fill(-1));
    cur.cars.forEach((c, i) => {
      if (i === except) return;
      for (let k = 0; k < c.len; k++) g[c.h ? c.y : c.y + k][c.h ? c.x + k : c.x] = i;
    });
    return g;
  }
  // 이 차가 움직일 수 있는 범위(시작 위치 기준 최소/최대 칸 수)
  function range(i) {
    const c = cur.cars[i], g = grid(i);
    const pos = c.h ? c.x : c.y;
    const at = (p) => (c.h ? g[c.y][p] : g[p][c.x]);
    let lo = pos, hi = pos;
    while (lo - 1 >= 0 && at(lo - 1) === -1) lo--;
    while (hi + c.len < N && at(hi + c.len) === -1) hi++;
    return [lo, hi];
  }

  let drag = null;
  function dragStart(e, i) {
    if (cur.done) return;
    e.preventDefault();
    const c = cur.cars[i], [lo, hi] = range(i);
    drag = { i, lo, hi, startPos: c.h ? c.x : c.y, startPx: c.h ? e.clientX : e.clientY, pos: c.h ? c.x : c.y };
    c.el.classList.add("drag");
    c.el.setPointerCapture(e.pointerId);
    const scale = stage.getBoundingClientRect().width / 360;
    drag.scale = scale;
    c.el.onpointermove = (ev) => {
      const px = ((c.h ? ev.clientX : ev.clientY) - drag.startPx) / drag.scale;
      let p = drag.startPos + px / CELL;
      p = Math.max(drag.lo, Math.min(drag.hi, p));
      drag.pos = p;
      if (c.h) c.el.style.left = p * CELL + 2 + "px"; else c.el.style.top = p * CELL + 2 + "px";
    };
    c.el.onpointerup = c.el.onpointercancel = () => dragEnd();
  }
  function dragEnd() {
    if (!drag) return;
    const c = cur.cars[drag.i];
    c.el.classList.remove("drag");
    c.el.onpointermove = c.el.onpointerup = c.el.onpointercancel = null;
    const np = Math.round(drag.pos), op = drag.startPos;
    drag = null;
    if (np !== op) {
      cur.hist.push({ i: cur.cars.indexOf(c), from: op, moves: cur.moves });
      if (c.h) c.x = np; else c.y = np;
      cur.moves++;
      cur.peak = Math.max(cur.peak, cur.moves);   // 되돌려도 힌트가 줄지 않게 가장 많이 움직인 횟수를 기억
      clearHint();
    }
    place(c); updateInfo();
    if (cur.cars[0].x === N - 2 && !cur.done) win();
  }

  $("btn-undo").onclick = () => {
    if (cur.done || !cur.hist.length) return;
    const h = cur.hist.pop(), c = cur.cars[h.i];
    if (c.h) c.x = h.from; else c.y = h.from;
    cur.moves = h.moves; place(c); clearHint(); updateInfo();
  };
  $("btn-reset").onclick = () => startLevel(cur.level.id, cur);
  $("btn-hint").onclick = useHint;
  $("btn-list").onclick = renderSelect;
  $("c-list").onclick = renderSelect;
  $("c-retry").onclick = () => startLevel(cur.level.id);
  $("c-next").onclick = () => {
    const next = levels.find((l) => l.no > cur.level.no && best[l.id] == null) || levels.find((l) => l.no > cur.level.no);
    next ? startLevel(next.id) : renderSelect();
  };

  async function win() {
    cur.done = true;
    clearHint();
    const red = cur.cars[0].el;
    red.style.left = (N * CELL + 20) + "px";
    updateInfo();
    const l = cur.level, prev = best[l.id], mv = cur.moves;
    let improved = prev == null || mv < prev;
    const before = score();            // 이번 판 반영 전 총점
    if (improved) { best[l.id] = mv; await saveProgress(); }
    setTimeout(async () => {
      $("c-big").textContent = mv === l.min ? "✓ 최소 이동 클리어!" : "클리어!";
      const gain = stagePts(l, best[l.id]) - (prev != null ? stagePts(l, prev) : 0);   // 이 판에서 새로 늘어난 점수
      let t = `${mv}번 이동 <span class="minb">최소 ${l.min}번</span><br>${stars(diff(l))} 최대 ${diff(l) * 100}점<br>` +
        `<b style="color:#ffc83d">${gain > 0 ? gain + "점 추가" : "점수 갱신 없음"}</b>`;
      if (prev != null && improved) t += `<br>🎉 새 기록!`;
      t += `<br>내 최고 기록: ${best[l.id]}번(${stagePts(l, best[l.id])}/${diff(l) * 100})`;
      const after = score();
      t += `<br>총점 ${after !== before ? before + " → " : ""}<b style="color:#ffc83d">${after}</b>`;
      $("c-text").innerHTML = t;
      $("c-next").style.display = levels.some((x) => x.no > l.no) ? "" : "none";
      $("clear").classList.add("on");
      if (improved) {                    // 점수가 바뀐 경우만 서버에 보내고, 순위는 응답이 오면 덧붙임
        const r = await submitScoreNow();
        if (r && r.rank) $("c-text").innerHTML += ` · ${r.rank}위`;
      }
    }, 450);
  }

  // ---------- 시작 ----------
  $("btn-start").onclick = renderSelect;
  $("btn-exit1").onclick = $("btn-exit2").onclick = () => MiniHub.exit();

  async function main() {
    MiniHub.init(GAME_ID);
    MiniHub.onReady((p) => { me = p; $("hello").textContent = p.name + "님"; });
    try { levels = (await (await fetch("./levels.json")).json()).levels;
      levels.forEach((l, i) => { if (l.no == null) l.no = i + 1; });
      levels.sort((a, b) => a.no - b.no); }
    catch { $("hello").textContent = "판 데이터를 불러오지 못했어요"; return; }
    const saved = await MiniHub.load();
    best = (saved && saved.best) || {};
    if (saved && saved.best && saved.v !== 2) {          // 예전 기록(출구로 나가는 1수를 더해서 셌음)을 새 방식으로 변환
      for (const k of Object.keys(best)) best[k] = Math.max(1, best[k] - 1);
      saveProgress();
    }
    lastSubmitted = clearedCount() > 0 ? score() : null;   // 이미 기록된 점수는 다시 보내지 않음
  }
  main();
})();
</script>
</body>
</html>
