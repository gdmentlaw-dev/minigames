<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>반응속도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Dongle:wght@400;700&display=swap">
<style>
  /* 반응속도: 낮을수록 좋은 점수(scoreOrder "asc"), ms 정수 — 메인페이지와 같은 소프트 파스텔 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(170deg, #ffe3f0 0%, #ebe4ff 55%, #dcf1ff 100%); }
  body { display: flex; align-items: center; justify-content: center;
         font-family: "Gowun Dodum", "Noto Sans KR", system-ui, sans-serif; word-break: keep-all; color: #4a3d6e;
         user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #stage { width: 360px; height: 640px; flex: none; position: relative; transform-origin: center center; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px; padding: 32px; text-align: center; }
  .screen.on { display: flex; }
  h1 { font-family: "Dongle", "Gowun Dodum", sans-serif; font-size: 72px; font-weight: 700; line-height: .9; color: #8f6fe0; }
  .hello { color: #d98a00; font-size: 18px; font-weight: 700; }
  .desc { color: #7a6c9e; font-size: 16px; line-height: 1.6; }
  .btn { border: 0; border-radius: 999px; padding: 14px 28px; font: inherit; font-size: 20px;
         font-weight: 700; cursor: pointer; min-width: 200px; color: #5a4300;
         background: linear-gradient(#ffeeb0, #ffd86b);
         box-shadow: inset 0 -5px 0 #f2bf3f, inset 0 4px 0 rgba(255,255,255,.65), 0 8px 16px rgba(242,191,63,.38); }
  .btn.sub { background: #fff; color: #4a3d6e; box-shadow: 0 4px 12px rgba(143,111,224,.2); }
  #pad { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 12px; cursor: pointer; transition: background .1s; }
  #pad { color: #fff; }
  #pad.wait { background: linear-gradient(#ff9ec4, #ff7ab0); }
  #pad.go { background: linear-gradient(#9be8c0, #4fcf93); }
  #pad.info { background: linear-gradient(#e2d8ff, #c9b8ff); color: #4a3d6e; }
  #pad-big { font-family: "Dongle", "Gowun Dodum", sans-serif; font-size: 76px; font-weight: 700; line-height: .9; }
  #pad-small { font-size: 18px; opacity: .9; }
  .result { font-size: 17px; font-weight: 700; color: #7a6c9e; min-height: 1.5em; }
  #final { font-family: "Dongle", "Gowun Dodum", sans-serif; font-size: 100px; font-weight: 700; line-height: .9; color: #c77700; }
</style>
</head>
<body>
<div id="stage">
  <section class="screen on" id="s-start">
    <h1>반응속도</h1>
    <p class="hello" id="hello">&nbsp;</p>
    <p class="desc">화면이 초록색이 되면 바로 누르세요.<br>3번 평균 기록 · 빠를수록 좋아요<br>조작: 화면 탭 / 스페이스바</p>
    <button class="btn" id="btn-start">시작</button>
    <button class="btn sub" id="btn-exit1">메인으로</button>
  </section>

  <section class="screen" id="s-play">
    <div id="pad" class="wait"><p id="pad-big">기다리세요…</p><p id="pad-small">1 / 3</p></div>
  </section>

  <section class="screen" id="s-over">
    <h1>평균 기록</h1>
    <p id="final">0ms</p>
    <p class="result" id="result">&nbsp;</p>
    <button class="btn" id="btn-retry">다시하기</button>
    <button class="btn sub" id="btn-exit2">메인으로</button>
  </section>
</div>

<script src="../../shared/minihub-sdk.js"></script>
<script>
  const GAME_ID = "sample-reaction";
  const ROUNDS = 3;

  const stage = document.getElementById("stage");
  function fit() {
    const s = Math.min(window.innerWidth / 360, window.innerHeight / 640);
    stage.style.transform = `scale(${s})`;
  }
  window.addEventListener("resize", fit);
  fit();

  MiniHub.init(GAME_ID);
  MiniHub.onReady(p => {
    document.getElementById("hello").textContent = `${p.name}님, 준비되셨나요?`;
  });

  const $ = id => document.getElementById(id);
  let state = "idle"; // idle | wait | go | info
  let round = 0, times = [], goAt = 0, timer = 0;

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  }
  function pad(cls, big, small) {
    $("pad").className = cls; $("pad-big").textContent = big; $("pad-small").textContent = small;
  }

  function start() {
    round = 0; times = [];
    show("s-play");
    nextRound();
  }

  function nextRound() {
    state = "wait";
    pad("wait", "기다리세요…", `${round + 1} / ${ROUNDS}`);
    clearTimeout(timer);
    timer = setTimeout(() => {
      state = "go"; goAt = performance.now();
      pad("go", "지금!", `${round + 1} / ${ROUNDS}`);
    }, 1000 + Math.random() * 2000);
  }

  function press() {
    if (state === "wait") {               // 너무 빨리 누름 → 이번 라운드 다시
      clearTimeout(timer); state = "info";
      pad("info", "너무 빨라요!", "탭해서 다시");
    } else if (state === "go") {
      const t = Math.round(performance.now() - goAt);
      times.push(t); round++;
      if (round >= ROUNDS) return end();
      state = "info";
      pad("info", `${t}ms`, "탭해서 다음");
    } else if (state === "info") {
      nextRound();
    }
  }

  function end() {
    state = "idle";
    const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
    $("final").textContent = `${avg}ms`;
    show("s-over");
    showResult(MiniHub.submitScore(avg)); // ms 정수, 낮을수록 좋음
  }

  // 저장 결과를 게임 화면에도 표시 (선택 사항 — 안 해도 SDK가 위쪽에 알림을 띄움)
  async function showResult(promise) {
    const el = $("result");
    el.textContent = "기록 저장 중…";
    const r = await promise;
    if (!r) el.textContent = "기록을 저장하지 못했어요";
    else if (r.improved && r.previous !== null) el.textContent = `🎉 신기록! (이전 ${r.previous}ms) · ${r.rank}위`;
    else if (r.improved) el.textContent = `첫 기록 저장! · ${r.rank}위`;
    else el.textContent = `내 최고 ${r.best}ms · ${r.rank}위`;
  }

  // 숨겨지면 현재 라운드 취소 (돌아오면 탭해서 다시)
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && (state === "wait" || state === "go")) {
      clearTimeout(timer); state = "info";
      pad("info", "일시정지", "탭해서 계속");
    }
  });

  $("btn-start").onclick = start;
  $("btn-retry").onclick = start;
  $("btn-exit1").onclick = () => MiniHub.exit();
  $("btn-exit2").onclick = () => MiniHub.exit();
  $("pad").addEventListener("pointerdown", e => { e.preventDefault(); press(); });
  window.addEventListener("keydown", e => {
    if (e.code === "Space" && !e.repeat && $("s-play").classList.contains("on")) { e.preventDefault(); press(); }
  });
</script>
</body>
</html>
