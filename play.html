<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="hub/style.css">
</head>
<body class="play">
<header id="topbar" hidden></header>
<div class="playbar">
  <a class="back" href="index.html">← 나가기</a>
  <div class="title" id="game-title">불러오는 중…</div>
  <div class="mybest" id="mybest"></div>
</div>
<main id="frame-wrap"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="hub/config.js"></script>
<script src="hub/store.js"></script>
<script src="hub/common.js"></script>
<script>
(async () => {
  const { store, esc, fmtScore } = Hub;
  const wrap = document.getElementById("frame-wrap");
  const fail = (msg) => {
    wrap.innerHTML = `<div class="card empty">${msg}<br><br><a class="btn" href="index.html">게임 목록으로</a></div>`;
  };

  const id = Hub.params.get("game") || "";
  const game = await Hub.loadGame(id);
  if (!game) return fail("게임을 찾을 수 없어요.");
  document.title = `${game.title} · ${MINIHUB_CONFIG.siteTitle || "미니게임"}`;
  document.getElementById("game-title").textContent = game.title;

  try { await Hub.boot("play"); } catch { return; }

  // ── 내 최고기록 표시 ──
  const bestEl = document.getElementById("mybest");
  async function showMine() {
    const me = await store.getMyGameEntry(game.id).catch(() => null);
    bestEl.innerHTML = me
      ? `최고 <b>${esc(fmtScore(me.score, game.scoreUnit))}</b><br>${me.rank}위 / ${me.players}명`
      : `<span>첫 도전!</span>`;
    return me;
  }
  showMine();

  // ── iframe (9:16 비율 유지) ──
  const frame = document.createElement("iframe");
  frame.id = "game-frame";
  frame.title = game.title;
  frame.allow = "autoplay; fullscreen; gamepad";
  function fit() {
    const W = wrap.clientWidth, H = wrap.clientHeight;
    const w = Math.min(W, Math.floor((H * 9) / 16));
    frame.style.width = w + "px";
    frame.style.height = Math.min(H, Math.floor((w * 16) / 9)) + "px";
  }
  window.addEventListener("resize", fit);

  // ── 게임과 통신 (규약: docs/SPEC.md 5장) ──
  let queue = Promise.resolve();
  window.addEventListener("message", (e) => {
    if (e.source !== frame.contentWindow) return;
    const d = e.data;
    if (!d || typeof d.type !== "string" || !d.type.startsWith("MINIHUB_")) return;
    if (d.gameId !== game.id) {
      console.warn(`[허브] gameId가 다릅니다. 받은 값: ${d.gameId}, 예상: ${game.id}`);
      return;
    }
    if (d.type === "MINIHUB_READY") {
      frame.contentWindow.postMessage(
        { type: "MINIHUB_INIT", player: { id: store.uid(), name: Hub.name } }, "*"
      );
    } else if (d.type === "MINIHUB_SCORE") {
      const s = d.score;
      if (!Number.isInteger(s) || s < 0 || s > game.scoreLimit) {
        console.warn("[허브] 허용 범위를 벗어난 점수라 무시합니다:", s, "(상한", game.scoreLimit + ")");
        return;
      }
      queue = queue.then(() => saveScore(s));
    } else if (d.type === "MINIHUB_EXIT") {
      location.href = "index.html";
    }
  });

  async function saveScore(score) {
    const before = await store.getMyGameEntry(game.id).catch(() => null);
    let res;
    try {
      res = await store.submitScore(game, score);
    } catch (e) {
      console.error(e);
      Hub.toast("⚠ 기록을 저장하지 못했어요. 인터넷 연결을 확인해주세요");
      return;
    }
    const me = await showMine();
    const unit = game.scoreUnit;
    const rankTxt = me ? ` · ${me.rank}위 / ${me.players}명` : "";
    if (res.improved && res.previous !== null && res.previous !== undefined) {
      const moved = before && me && me.rank < before.rank ? ` (${before.rank}위 → ${me.rank}위)` : "";
      Hub.toast(`🎉 <b>신기록!</b> ${esc(fmtScore(res.previous, unit))} → <b>${esc(fmtScore(score, unit))}</b>${moved || rankTxt}`, 5000);
    } else if (res.improved) {
      Hub.toast(`✅ 첫 기록 <b>${esc(fmtScore(score, unit))}</b> 저장!${rankTxt}`, 5000);
    } else {
      Hub.toast(`이번 기록 ${esc(fmtScore(score, unit))} · 최고 <b>${esc(fmtScore(res.best, unit))}</b>${rankTxt}`);
    }
  }

  frame.src = `games/${game.id}/index.html`;
  wrap.appendChild(frame);
  fit();
})();
</script>
</body>
</html>
